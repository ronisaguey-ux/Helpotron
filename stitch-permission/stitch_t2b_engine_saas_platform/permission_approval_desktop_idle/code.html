<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-container-lowest'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.surface-container-high'); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.outline-variant'); 
        }

        /* Subtle Teal Glow for Primary Elements */
        .teal-glow-focus:focus-within {
            box-shadow: 0 0 15px rgba(65, 229, 117, 0.15);
            border-color: theme('colors.secondary');
        }
        
        /* Amber Glow for Warning State */
        .amber-glow {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.1);
        }
        
        /* Animated gradient background for dashboard simulation */
        .bg-animated-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(11, 31, 42, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(27, 28, 28, 0.9) 0px, transparent 50%);
            background-color: theme('colors.surface-container-lowest');
        }

<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex flex-col font-body-md overflow-hidden relative selection:bg-secondary selection:text-on-secondary">
<!-- Background Simulation: Dark Dashboard Context -->
<div class="absolute inset-0 z-0 bg-animated-mesh">
<div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIvPgo8Y2lyY2xlIGN4PSIyMCIgY3k9IjIwIiByPSIxIiBmaWxsPSIjNDM0NzRiIi8+Cjwvc3ZnPg==')]"></div>
</div>
<!-- Main Content Area: Centered Modal -->
<main class="flex-grow flex items-center justify-center p-md relative z-10 w-full h-full">
<!-- Modal Overlay / Backdrop -->
<div class="absolute inset-0 bg-surface-container-lowest/60 backdrop-blur-sm z-10 pointer-events-none"></div>
<!-- Modal Container -->
<div class="relative z-20 w-full max-w-2xl bg-surface-container-low/90 backdrop-blur-xl rounded-xl border border-outline-variant amber-glow overflow-hidden shadow-2xl flex flex-col transform transition-all duration-300 scale-100">
<!-- Modal Header -->
<header class="p-lg border-b border-outline-variant flex items-start gap-md">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-high border border-amber-500/30 flex items-center justify-center text-amber-500">
<span class="material-symbols-outlined text-[28px]" data-icon="warning">warning</span>
</div>
<div class="flex-grow">
<div class="flex items-center gap-sm mb-xs flex-wrap">
<span class="font-label-caps text-label-caps text-amber-500 border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 rounded-sm">CHANGE_SETTINGS</span>
<span class="font-code-sm text-code-sm text-outline-variant">ref #42</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Permission Required: Change Settings</h1>
</div>
</header>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Action Description -->
<div class="font-body-lg text-body-lg text-on-surface-variant">
                    Apply <span class="text-on-surface font-bold">1</span> setting change: font scale → 1.
                </div>
<!-- Data Table / List -->
<div class="border border-outline-variant rounded-lg bg-surface-container-highest/30 overflow-hidden">
<table class="w-full text-left border-collapse">
<tbody>
<tr class="border-b border-outline-variant last:border-b-0 hover:bg-surface-container-high/50 transition-colors">
<td class="py-sm px-md font-body-md text-on-surface border-r border-outline-variant w-1/2">
                                    font scale
                                </td>
<td class="py-sm px-md font-code-sm text-code-sm text-secondary w-1/2 flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px] text-outline-variant" data-icon="arrow_right_alt">arrow_right_alt</span>
                                    1
                                </td>
</tr>
</tbody>
</table>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-outline" for="agent-instruction">Instruction Override (Optional)</label>
<div class="relative teal-glow-focus transition-all duration-200 rounded-lg">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md text-on-surface font-body-sm text-body-sm placeholder:text-outline-variant focus:outline-none focus:ring-0 focus:border-secondary resize-none" id="agent-instruction" placeholder="Add an instruction for the agent..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Modal Footer (Actions) -->
<footer class="p-lg border-t border-outline-variant bg-surface-container-low flex flex-wrap items-center justify-between gap-md">
<!-- Secondary / Subtle Actions (Left aligned) -->
<div class="flex gap-sm">
<button class="px-md py-sm rounded-DEFAULT border border-amber-500/50 text-amber-500 font-label-caps text-label-caps hover:bg-amber-500/10 transition-colors duration-200 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="all_inclusive">all_inclusive</span>
                        ALWAYS ALLOW
                    </button>
<button class="px-md py-sm rounded-DEFAULT text-primary font-label-caps text-label-caps hover:bg-surface-container-high transition-colors duration-200 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
                        WRITE SOMETHING ELSE
                    </button>
</div>
<!-- Primary / Critical Actions (Right aligned) -->
<div class="flex gap-sm">
<button class="px-md py-sm rounded-DEFAULT bg-error/10 border border-error/50 text-error font-label-caps text-label-caps hover:bg-error hover:text-on-error transition-colors duration-200 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="block">block</span>
                        REJECT
                    </button>
<button class="px-md py-sm rounded-DEFAULT bg-secondary text-on-secondary font-label-caps text-label-caps hover:bg-secondary-fixed-dim transition-colors duration-200 flex items-center gap-xs font-bold shadow-[0_0_10px_rgba(65,229,117,0.3)]">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
                        APPROVE
                    </button>
</div>
</footer>
</div>
</main>
<!-- Shared Navigation Components Suppressed: Transactional/Task-Focused Intent -->

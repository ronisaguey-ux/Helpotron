<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Helpotron OS - Permission Approval</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {
                    "colors": {

                        "on-tertiary": "#422c18",
                        "outline": "#8d9195",
                        "tertiary": "#e3c0a4",
                        "primary": "#b5c9d8",
                        "surface-tint": "#b5c9d8",
                        "on-tertiary-container": "#9e7f66",
                        "on-secondary": "#003915",
                        "surface-bright": "#39393a",
                        "outline-variant": "#43474b",
                        "secondary-container": "#06c85d",
                        "tertiary-fixed": "#ffdcc1",
                        "surface-container-high": "#292a2b",
                        "on-secondary-container": "#004d1f",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#002109",
                        "on-tertiary-fixed": "#2a1706",
                        "secondary-fixed-dim": "#3de273",
                        "on-secondary-fixed-variant": "#005322",
                        "tertiary-container": "#2c1907",
                        "secondary-fixed": "#66ff8e",
                        "inverse-on-surface": "#303031",
                        "inverse-surface": "#e4e2e3",
                        "on-primary-fixed-variant": "#364955",
                        "inverse-primary": "#4e616e",
                        "background": "#131314",
                        "surface-container-low": "#1b1c1c",
                        "on-surface": "#e4e2e3",
                        "on-surface-variant": "#c3c7cb",
                        "tertiary-fixed-dim": "#e3c0a4",
                        "on-primary-container": "#748895",
                        "surface-container-lowest": "#0d0e0f",
                        "on-background": "#e4e2e3",
                        "on-primary-fixed": "#091e29",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "secondary": "#41e575",
                        "surface": "#131314",
                        "on-tertiary-fixed-variant": "#5a422c",
                        "primary-container": "#0b1f2a",
                        "surface-variant": "#343536",
                        "primary-fixed": "#d1e5f5",
                        "primary-fixed-dim": "#b5c9d8",
                        "surface-container": "#1f2020",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "gutter": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "4px",

                        "xl": "32px",
                        "container-margin": "40px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],

<style>
        body {
            background-color: #000; /* Dark backdrop to simulate modal overlay */
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .sheet-container {
            width: 100%;
            max-width: 390px;
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        /* Glassy Navy Effect */
        .glassy-navy {
            background-color: rgba(11, 31, 42, 0.85); /* primary-container with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased">
<!-- Modal Backdrop / Scrim -->
<div class="absolute inset-0 bg-black/60 z-0"></div>
<!-- Bottom Sheet -->
<div class="sheet-container relative z-10 glassy-navy rounded-t-2xl border-t border-l border-r border-surface-container-high shadow-2xl flex flex-col max-h-[795px]">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-sm pb-2">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-gutter pb-lg pt-sm flex flex-col items-center border-b border-surface-container-high">
<div class="bg-tertiary-container/30 p-md rounded-full mb-md border border-tertiary-fixed/20">
<span class="material-symbols-outlined text-[32px] text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface text-center mb-xs">Permission Required</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center max-w-[280px]">
                System module <span class="font-code-sm text-code-sm text-primary">Helpotron OS</span> is requesting elevated access to core parameters.
            </p>
</div>
<!-- Content Area -->
<div class="px-gutter py-lg overflow-y-auto flex-1">
<h3 class="font-label-caps text-label-caps text-outline mb-sm uppercase tracking-wider">Requested Changes</h3>
<div class="bg-surface-container-low border border-surface-container-high rounded-lg overflow-hidden flex flex-col gap-[1px]">
<!-- Change Row 1 -->
<div class="bg-surface-container-low p-md flex justify-between items-center group hover:bg-surface-container transition-colors">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline-variant text-[20px]">
                            text_format
                        </span>
<span class="font-code-sm text-code-sm text-on-surface-variant">font scale</span>
</div>
<div class="flex items-center gap-sm">
<span class="font-code-sm text-code-sm text-error line-through opacity-50">1.5</span>
<span class="material-symbols-outlined text-outline-variant text-[16px]">arrow_forward</span>
<span class="font-code-sm text-code-sm text-secondary">1</span>
</div>
</div>
<!-- Change Row 2 (Example for context) -->
<div class="bg-surface-container-low p-md flex justify-between items-center group hover:bg-surface-container transition-colors border-t border-surface-container-highest/50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline-variant text-[20px]">
                            memory
                        </span>
<span class="font-code-sm text-code-sm text-on-surface-variant">alloc_mem</span>
</div>
<div class="flex items-center gap-sm">
<span class="font-code-sm text-code-sm text-secondary">256MB</span>
</div>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="px-gutter pb-xl pt-md flex flex-col gap-sm border-t border-surface-container-high bg-surface-container-lowest/50">
<button class="w-full bg-secondary text-on-secondary-container font-label-caps text-label-caps py-md rounded hover:bg-secondary-fixed transition-colors flex items-center justify-center gap-sm group">
<span class="material-symbols-outlined text-[18px] group-hover:scale-110 transition-transform">check_circle</span>
                APPROVE
            </button>
<button class="w-full bg-transparent border border-surface-container-high text-on-surface font-label-caps text-label-caps py-md rounded hover:bg-surface-container-high transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">cancel</span>
                REJECT
            </button>
<button class="w-full bg-transparent border border-surface-container-high text-primary font-label-caps text-label-caps py-md rounded hover:bg-primary/10 transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
                ALWAYS ALLOW
            </button>
<button class="w-full bg-transparent text-outline-variant font-body-sm text-body-sm py-sm mt-xs hover:text-on-surface transition-colors underline decoration-outline-variant/50 underline-offset-4">
                Write something else
            </button>
</div>
</div>
</body></html>

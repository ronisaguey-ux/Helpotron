server {
    listen 80;
    listen [::]:80;
    server_name helpotron.dpdns.org www.helpotron.dpdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helpotron.dpdns.org www.helpotron.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/helpotron.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpotron.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (WCAG & OWASP compliant)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://openrouter.ai wss://helpotron.dpdns.org https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://cloudflareinsights.com data: blob:; frame-src https://challenges.cloudflare.com https://*.challenges.cloudflare.com; worker-src 'self' blob: data:; frame-ancestors 'none';" always;

    # Upload Size Limit (25MB for PDFs/DOCX/Audio)
    # Note: Define `limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;` in /etc/nginx/nginx.conf http {} block
    client_max_body_size 25m;

    # Web Frontend
    location / {
        root /var/www/helpotron/web/dist;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI Backend Reverse Proxy
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Gateway for Autonomous Browser Agents
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name helpotron.com www.helpotron.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helpotron.com www.helpotron.com;

    ssl_certificate /etc/letsencrypt/live/helpotron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpotron.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (WCAG & OWASP compliant)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://openrouter.ai wss://helpotron.com; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # Upload Size Limit (25MB for PDFs/DOCX/Audio)
    # Note: Define `limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;` in /etc/nginx/nginx.conf http {} block
    client_max_body_size 25m;

    # Web Frontend
    location / {
        root /var/www/helpotron/web/dist;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI Backend Reverse Proxy
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Gateway for Autonomous Browser Agents
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# /etc/nginx/sites-available/helpotron — point server_name at your domain.
# Requires: certbot --nginx for TLS.
server {
    listen 80;
    server_name helpotron.example.com;

    # Web dashboard (static build)
    root /home/roni/Roni_Workspace/helpotron/web/dist;
    index index.html;

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

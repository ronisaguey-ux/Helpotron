# /etc/nginx/sites-available/helpotron — point server_name at your domain.
# Automated reverse proxy & SPA mapping for Helpotron production VPS deployment.

server {
    listen 80;
    listen [::]:80;
    server_name helpotron.com www.helpotron.com helpotron.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helpotron.com www.helpotron.com helpotron.example.com;

    # SSL Certificate Paths (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/helpotron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpotron.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Production Client SPA Asset Root
    root /var/www/helpotron/web/dist;
    index index.html;

    # Backend API Routing Intercept
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Asynchronous WebSockets Agent Handling Pipeline
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health & System Checks
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    # Static Web SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helpotron Automator</title>
  <style>
    body { width: 300px; padding: 16px; font-family: system-ui, sans-serif; margin: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; background: #f8fafc; cursor: pointer; font-size: 14px; }
    button:hover { background: #eef2f7; }
    #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 2px 0 8px; border: 1px solid #ccc; border-radius: 6px; }
    label { font-size: 11px; color: #666; }
    details { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>🤖 Helpotron Automator</h2>
  <button id="startScrape">📄 Start Scrape</button>
  <button id="startRecording">🎙️ Record Lecture</button>
  <button id="activateAgent">🤖 Activate Agent (30min–1h)</button>
  <div id="agentStatus" style="font-size:11px;color:#555;margin-top:4px;"></div>
  <details>
    <summary style="font-size:12px;color:#666;cursor:pointer">Settings</summary>
    <label>Server URL</label>
    <input id="server" placeholder="http://localhost:8000">
    <label>Your user id</label>
    <input id="public_id" placeholder="dev-user">
    <button id="saveSettings">Save</button>
  </details>
  <div id="status">Ready</div>
  <script src="popup.js"></script>
</body>
</html>

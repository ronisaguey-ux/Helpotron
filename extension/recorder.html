<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helpotron — Lecture Recorder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 440px;
      margin: 30px auto;
      padding: 0 20px;
      text-align: center;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 { font-size: 20px; margin-bottom: 8px; color: #60a5fa; }
    #timer { font-size: 42px; font-weight: 700; margin: 16px 0; font-family: monospace; color: #38bdf8; }
    #visualizer {
      width: 100%;
      height: 70px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      margin: 12px 0 20px;
      display: block;
    }
    button {
      padding: 12px 24px;
      margin: 6px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    #recordBtn { background: #ef4444; color: white; }
    #stopBtn { background: #10b981; color: white; display: none; }
    #state { margin-top: 18px; font-size: 13px; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>🎙️ Helpotron Lecture Recorder</h2>
  <div id="timer">00:00</div>
  <canvas id="visualizer" width="400" height="70"></canvas>
  <div>
    <button id="recordBtn">Start Recording</button>
    <button id="stopBtn">Stop & Upload to Helpotron</button>
  </div>
  <div id="state">Ready. Click Start Recording to capture lecture audio.</div>
  <script src="recorder.js"></script>
</body>
</html>

version: '3.8'

services:
  helpotron-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PRODUCTION_MODE=${PRODUCTION_MODE:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32)}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - DATABASE_URL=postgresql+psycopg2://helpotron:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/helpotron
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=helpotron
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=helpotron
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - helpotron_uploads:/app/uploads
      - helpotron_exports:/app/exports
      - helpotron_lake:/app/data_lake

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpotron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: helpotron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpotron"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  helpotron_uploads:
  helpotron_exports:
  helpotron_lake:

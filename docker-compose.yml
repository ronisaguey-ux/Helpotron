version: '3.8'

services:
  helpotron-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PRODUCTION_MODE=${PRODUCTION_MODE:-false}
      - JWT_SECRET=${JWT_SECRET:-helpotron_super_secret_jwt_signing_key_for_docker_local_32chars}
      - DATABASE_URL=postgresql+psycopg2://helpotron:${POSTGRES_PASSWORD:-helpotron_secure_pg_pass_2026}@postgres:5432/helpotron
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=helpotron
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-helpotron_secure_pg_pass_2026}
      - POSTGRES_DB=helpotron
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpotron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpotron_secure_pg_pass_2026}
      POSTGRES_DB: helpotron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpotron"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

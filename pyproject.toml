[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helpotron"
version = "0.1.0"
description = "Helpotron backend"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.importlinter]
root_package = "server"

[[tool.importlinter.contracts]]
name = "Forbid legacy and shim imports from active modules"
type = "forbidden"
source_modules = [
    "server.legacy",
    "server.shim"
]
forbidden_modules = [
    "server.main"
]

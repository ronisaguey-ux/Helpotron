<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Helpotron — Temporarily Closed</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --line:#222838;
    --ink:#e8ecf5; --dim:#8b95ad; --accent:#6ea8ff; --warn:#ffb457;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(900px 520px at 50% -10%, #17203a 0%, transparent 62%),
      var(--bg);
    color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .card{
    width:100%;max-width:640px;
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
    border:1px solid var(--line);border-radius:18px;
    padding:44px 34px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .badge{
    display:inline-block;
    font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--warn);
    border:1px solid rgba(255,180,87,.32);
    background:rgba(255,180,87,.08);
    padding:9px 13px;border-radius:999px;margin-bottom:26px;
  }
  h1{margin:0 0 14px;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;font-weight:700}
  p{margin:0 auto;color:var(--dim);max-width:46ch}
  .lead{color:var(--ink);font-size:18px;margin-bottom:18px}
  .rule{height:1px;background:var(--line);margin:30px 0 22px}
  .foot{font-size:13px;color:#66708a}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--accent);margin-right:8px;vertical-align:middle;
       animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">Temporarily Closed</div>
    <h1>A big update is coming.</h1>
    <p class="lead">Helpotron is offline while we ship a major upgrade.</p>
    <p>
      We've taken the site down on purpose so the work can land cleanly.
      Everything you have is safe. We'll be back shortly — thank you for your patience.
    </p>
    <div class="rule"></div>
    <div class="foot"><span class="dot"></span>Maintenance in progress</div>
  </main>
</body>
</html>

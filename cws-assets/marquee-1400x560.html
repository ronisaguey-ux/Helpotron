<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:560px;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;
background:linear-gradient(120deg,#312e81 0%,#4c1d95 55%,#6d28d9 100%)}
.wrap{width:1400px;height:560px;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box}
.badge{width:300px;height:300px;border-radius:68px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);

.badge img{width:252px;height:252px;border-radius:56px}
h1{margin:0 0 14px;font-size:64px;font-weight:800;color:#fff;letter-spacing:-.5px}
p{margin:0;font-size:29px;color:#d8cff5;line-height:1.45}
.chips{margin-top:30px;display:flex;gap:14px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:21px;
padding:10px 22px;border-radius:999px}
</style></head><body><div class="wrap">
<div class="badge"><img src="credits_logo.png" alt=""></div>
<div>
<h1>Helpotron Academic Companion</h1>
<p>Save course pages, files &amp; rubrics — chat with a screen-aware<br>agent that can act on a tab with your approval.</p>
<div class="chips"><span class="chip">Canvas · Classroom · Blackboard</span><span class="chip">Moodle · Notion · Docs · Gmail</span></div>
</div>
</div></body></html>

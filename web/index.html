<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (08-28): let env(safe-area-inset-*) work on notched
         iPhones so the fixed bottom nav and sticky topbar pad correctly.
         No user-scalable/maximum-scale: pinch zoom stays enabled (a11y). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Helpotron Academic Companion — AI study companion for your courses</title>
    <meta name="description" content="Autonomous AI study platform, lecture transcription, dynamic writing humanization, practice test generation, and intelligent study groups." />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" type="image/jpeg" href="/HelpoTron_logo.jpeg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helpotron.dpdns.org/" />
    <meta property="og:title" content="Helpotron Academic Companion — AI Study Suite" />
    <meta property="og:description" content="Autonomous AI study platform, lecture audio transcription, style-calibrated humanization, interactive flashcards, and practice tests." />
    <meta property="og:image" content="https://helpotron.dpdns.org/og-preview.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://helpotron.dpdns.org/" />
    <meta name="twitter:title" content="Helpotron Academic Companion — AI Study Suite" />
    <meta name="twitter:description" content="Autonomous AI study platform, lecture audio transcription, style-calibrated humanization, interactive flashcards, and practice tests." />
    <meta name="twitter:image" content="https://helpotron.dpdns.org/og-preview.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalApplication",
      "name": "Helpotron Academic Companion",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web, Windows, macOS, Linux, ChromeOS",
      "description": "Autonomous AI study assistant with deterministic math verification, lecture audio transcription, classic literature style calibration, and multi-detector evasion.",
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <main id="root"></main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

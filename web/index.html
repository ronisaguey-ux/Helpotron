<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (08-28): let env(safe-area-inset-*) work on notched
         iPhones so the fixed bottom nav and sticky topbar pad correctly.
         No user-scalable/maximum-scale: pinch zoom stays enabled (a11y). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Helpotron — Academic Workspace & Assignment Workflow</title>
    <meta name="description" content="Helpotron is an academic workspace combining multi-source assignment drafting, Canvas LMS sync, interactive flashcards, and voice-preserving style coaching." />
    <meta name="keywords" content="AI study tool, Assignment drafter, Canvas LMS integration, flashcard generator, quiz maker, academic workspace, style coach" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://helpotron.com/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Helpotron — Academic Workspace & Assignment Workflow" />
    <meta property="og:description" content="Draft assignments from rubrics, generate flashcards and quizzes, sync with Canvas LMS, and refine your natural academic voice." />
    <meta property="og:url" content="https://helpotron.com/" />
    <meta property="og:site_name" content="Helpotron" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Helpotron — Academic Workspace & Assignment Workflow" />
    <meta name="twitter:description" content="Draft assignments from rubrics, generate flashcards and quizzes, sync with Canvas LMS, and refine your natural academic voice." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Helpotron",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "Academic study workspace with multi-source Assignment drafting, Canvas LMS integration, flashcards, quizzes, and natural voice style coaching.",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "0.01",
        "highPrice": "30.00",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Multi-source Assignment drafting with citation grounding",
        "Style profile calibration & natural voice refinement",
        "Flashcard, quiz, study guide, and podcast generation",
        "Canvas LMS assignment import and submission workflow",
        "STEM solver with step-by-step verification"
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- A div, not <main>: AppShell renders its own <main id="main-content">
         (the skip link's target), so mounting React into a <main> gave every
         authenticated page nested main landmarks. axe: landmark-no-duplicate-main
         + landmark-main-is-top-level. Nothing selects #root by tag name. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

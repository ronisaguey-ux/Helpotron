name: Hardened Production VPS Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.pre-commit-config.yaml'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Atomic VPS Sync & Daemon Reload
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Deploy to VPS via Secure SSH Action
        uses: appleboy/ssh-action@7eaf76671a0d7e35d6892e5ba0d7d237f97c773c # v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "--> Pulling latest changes from main..."
            cd /home/helpotron/helpotron || cd /home/roni/Roni_Workspace/helpotron
            git fetch origin main
            git reset --hard origin/main
            
            echo "--> Updating Python dependencies..."
            .venv/bin/pip install -r server/requirements.txt --no-cache-dir
            
            echo "--> Building frontend SPA..."
            cd web && npm ci && npm run build && cd ..
            
            echo "--> Reloading Systemd daemons..."
            sudo systemctl daemon-reload
            sudo systemctl restart helpotron-api.service helpotron-bot.service
            
            echo "--> Deployment successfully verified."
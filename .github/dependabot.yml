# Helpotron Automator — Dependabot Configuration
# Daily automated dependency and security updates across backend, frontend, and GitHub Actions.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "ronisaguey-ux"
    labels:
      - "dependencies"
      - "backend"
      - "security"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "ronisaguey-ux"
    labels:
      - "dependencies"
      - "frontend"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "security"

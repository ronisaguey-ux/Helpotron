version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "ronisaguey-ux"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "ronisaguey-ux"
    labels:
      - "dependencies"
      - "frontend"
